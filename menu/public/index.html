<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Menü</title>
  <meta name="description" content="Dijital QR menü">
  <meta name="theme-color" content="#c2410c">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/menu.css">
  <script type="module" src="/js/menu.js"></script>
</head>
<body>
  <a class="skip-link" href="#menu-content">Menüye geç</a>

  <header class="site-header">
    <div class="container header-inner">
      <img id="logo" class="logo" alt="" width="72" height="72" hidden>
      <div class="header-text">
        <h1 id="restaurant-name" class="restaurant-name">Menü</h1>
        <p id="restaurant-desc" class="restaurant-desc" hidden></p>
      </div>
    </div>
  </header>

  <div id="toolbar" class="toolbar" hidden>
    <div class="container toolbar-inner">
      <div class="search">
        <label for="search" class="visually-hidden">Menüde ara</label>
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="m20 20-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="search" type="search" placeholder="Yemek veya içecek ara…" autocomplete="off" enterkeyhint="search">
      </div>
      <nav class="tabs" aria-label="Kategoriler">
        <ul id="tabs" class="tabs-list"></ul>
      </nav>
    </div>
  </div>

  <main id="menu-content" class="container menu-main" tabindex="-1" aria-busy="true">
    <p id="search-status" class="visually-hidden" role="status" aria-live="polite"></p>

    <div id="loading" class="loading" aria-label="Menü yükleniyor">
      <div class="skeleton skeleton-title"></div>
      <div class="grid">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </div>

    <div id="message" class="message" hidden>
      <p id="message-title" class="message-title"></p>
      <p id="message-text" class="message-text"></p>
      <button id="message-action" class="btn btn-primary" type="button" hidden></button>
    </div>

    <div id="sections"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="footer-text">Afiyet olsun!</p>
    </div>
  </footer>

  <template id="placeholder-icon">
    <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true" focusable="false">
      <path d="M7 2v9a2 2 0 0 0 2 2v9M5 2v6M9 2v6M5 8h4M17 22V2c-2 1.5-3 4-3 8s1 4 3 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </template>
</body>
</html>
